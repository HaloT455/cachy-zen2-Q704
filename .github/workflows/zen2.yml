name: Build Q704 CachyOS Haswell EEVDF Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "CachyOS/linux tag or branch"
        required: false
        default: "cachyos-7.2.8-1"
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/CachyOS/linux.git
  KERNEL_REF_DEFAULT: cachyos-7.2.8-1
  CONFIG_URL: https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-eevdf/config
  KERNEL_SUFFIX: "-cachyos-q704-haswell-eevdf"
  LLVM_VERSION: "23.1.2"
  LLVM_DIR: "/opt/llvm"

jobs:
  build:
    name: Build Q704 Haswell kernel
    runs-on: ubuntu-24.04

    env:
      LIBCLANG_PATH: /opt/llvm/lib

    steps:
      - name: Resolve kernel ref
        env:
          INPUT_REF: ${{ inputs.kernel_ref }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            REF="${INPUT_REF}"
          else
            REF="${KERNEL_REF_DEFAULT}"
          fi

          if ! printf '%s' "${REF}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid kernel ref: ${REF}"
            exit 1
          fi

          echo "Building CachyOS/linux ref: ${REF}"
          echo "KERNEL_REF=${REF}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio flex fakeroot \
            libelf-dev libssl-dev libdw-dev dwarves gettext git kmod \
            libncurses-dev openssl pahole perl python3 rsync tar xz-utils zstd curl

      - name: Install LLVM
        run: |
          curl -fL \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" \
            -o /tmp/llvm.tar.xz

          sudo mkdir -p "${LLVM_DIR}"
          sudo chown "$(id -u):$(id -g)" "${LLVM_DIR}"

          tar -xJf /tmp/llvm.tar.xz \
            --strip-components=1 \
            -C "${LLVM_DIR}"

          echo "${LLVM_DIR}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${LLVM_DIR}/lib" >> "$GITHUB_ENV"

          export PATH="${LLVM_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${LLVM_DIR}/lib"

          clang --version
          ld.lld --version

      - name: Checkout CachyOS kernel
        run: |
          git clone \
            --depth=1 \
            --branch="${KERNEL_REF}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel log -1 --oneline

      - name: Fetch CachyOS EEVDF config
        working-directory: kernel
        run: |
          curl -fL "${CONFIG_URL}" -o .config

      - name: Configure Q704 Haswell kernel
        working-directory: kernel
        run: |
          # Q704: Intel Core i3-4010U, Haswell, 2C/4T.
          # Never use -march=native here because GitHub runners use another CPU.
          scripts/config --disable X86_NATIVE_CPU || true
          scripts/config --disable MNATIVE_INTEL || true
          scripts/config --disable MNATIVE_AMD || true
          scripts/config --disable MZEN || true
          scripts/config --disable MZEN2 || true
          scripts/config --disable MZEN3 || true
          scripts/config --disable MZEN4 || true
          scripts/config --disable MZEN5 || true

          if grep -q '^config MHASWELL' arch/x86/Kconfig.cpu; then
            echo "CONFIG_MHASWELL available"
            scripts/config --disable GENERIC_CPU
            scripts/config --enable MHASWELL
            echo "CPU_CFLAGS=" >> "$GITHUB_ENV"
          else
            echo "CONFIG_MHASWELL unavailable -> GENERIC_CPU + -march=haswell"
            scripts/config --enable GENERIC_CPU
            echo "CPU_CFLAGS=-march=haswell -mtune=haswell" >> "$GITHUB_ENV"
          fi

          # EEVDF / low-latency desktop scheduling
          scripts/config --disable SCHED_BORE || true
          scripts/config --enable PREEMPT_BUILD || true
          scripts/config --disable PREEMPT_NONE || true
          scripts/config --disable PREEMPT_VOLUNTARY || true
          scripts/config --enable PREEMPT || true
          scripts/config --enable PREEMPT_COUNT || true
          scripts/config --enable PREEMPTION || true
          scripts/config --enable PREEMPT_DYNAMIC || true

          # 300 Hz + tickless idle: good balance for this 15 W Haswell tablet
          scripts/config --disable HZ_100 || true
          scripts/config --disable HZ_250 || true
          scripts/config --enable HZ_300 || true
          scripts/config --disable HZ_500 || true
          scripts/config --disable HZ_600 || true
          scripts/config --disable HZ_750 || true
          scripts/config --disable HZ_1000 || true
          scripts/config --set-val HZ 300
          scripts/config --disable HZ_PERIODIC || true
          scripts/config --disable NO_HZ_FULL || true
          scripts/config --enable NO_HZ_IDLE || true
          scripts/config --enable NO_HZ || true
          scripts/config --enable NO_HZ_COMMON || true

          # MGLRU, small CPU topology
          scripts/config --enable LRU_GEN || true
          scripts/config --enable LRU_GEN_ENABLED || true
          scripts/config --disable LRU_GEN_STATS || true
          scripts/config --disable NUMA || true
          scripts/config --set-val NR_CPUS 8

          # O3 + ThinLTO
          if grep -rq 'CC_OPTIMIZE_FOR_PERFORMANCE_O3' init/Kconfig; then
            scripts/config --disable CC_OPTIMIZE_FOR_PERFORMANCE || true
            scripts/config --enable CC_OPTIMIZE_FOR_PERFORMANCE_O3
          fi
          scripts/config --disable LTO_NONE || true
          scripts/config --disable LTO_CLANG_FULL || true
          scripts/config --enable LTO_CLANG_THIN || true

          # No Rust is needed for the Q704 drivers; saves build setup/time.
          scripts/config --disable RUST || true

          # Keep build size reasonable.
          scripts/config --enable DEBUG_INFO_NONE || true
          scripts/config --disable DEBUG_INFO || true
          scripts/config --disable DEBUG_INFO_BTF || true
          scripts/config --disable DEBUG_INFO_BTF_MODULES || true
          scripts/config --set-str SYSTEM_TRUSTED_KEYS "" || true
          scripts/config --set-str SYSTEM_REVOCATION_KEYS "" || true

          # Q704 critical hardware.
          scripts/config --enable BT || true
          scripts/config --module BT_HCIBTUSB || true
          scripts/config --module BT_INTEL || true
          scripts/config --disable BT_HCIBTUSB_AUTOSUSPEND || true

          scripts/config --module IWLWIFI || true
          scripts/config --module IWLMVM || true

          scripts/config --module FUJITSU_LAPTOP || true
          scripts/config --module HID_WACOM || true

          scripts/config --enable USB_XHCI_HCD || true
          scripts/config --enable USB_XHCI_PCI || true
          scripts/config --enable USB_EHCI_HCD || true
          scripts/config --enable USB_EHCI_PCI || true

          # Keep Intel graphics / UVC / common HID and storage from the base config.
          scripts/config --set-str LOCALVERSION "${KERNEL_SUFFIX}"
          scripts/config --disable LOCALVERSION_AUTO

          make LLVM=1 olddefconfig

          echo "===== CPU ====="
          grep -E '^CONFIG_(MHASWELL|GENERIC_CPU|MZEN|MZEN2|MZEN3|MZEN4|MNATIVE_AMD|MNATIVE_INTEL|X86_NATIVE_CPU)=' .config || true
          echo "CPU_CFLAGS=${CPU_CFLAGS}"

          echo "===== Q704 CONFIG ====="
          grep -E '^CONFIG_(PREEMPT|PREEMPT_DYNAMIC|HZ_300|LRU_GEN|LTO_CLANG_THIN|CC_OPTIMIZE_FOR_PERFORMANCE_O3|BT_INTEL|BT_HCIBTUSB|IWLWIFI|IWLMVM|HID_WACOM|USB_XHCI_HCD|USB_EHCI_HCD|FUJITSU_LAPTOP)=' .config || true
          grep '^CONFIG_HZ=' .config || true

          echo "===== VERIFY ====="
          grep -q '^CONFIG_MHASWELL=y' .config || grep -q '^CONFIG_GENERIC_CPU=y' .config \
            || { echo "No valid Haswell-compatible CPU target"; exit 1; }
          grep -q '^CONFIG_CC_IS_CLANG=y' .config || { echo "Kernel is not configured for clang"; exit 1; }
          grep -q '^CONFIG_LTO_CLANG_THIN=y' .config || { echo "ThinLTO not enabled"; exit 1; }
          grep -q '^CONFIG_PREEMPT_DYNAMIC=y' .config || { echo "PREEMPT_DYNAMIC not enabled"; exit 1; }
          grep -q '^CONFIG_HZ_300=y' .config || { echo "HZ_300 not enabled"; exit 1; }
          grep -q '^CONFIG_LRU_GEN=y' .config || { echo "MGLRU not enabled"; exit 1; }

      - name: Build Q704 kernel
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: HaloT455
          KBUILD_BUILD_HOST: github-q704
        run: |
          make -j"$(nproc)" \
            LLVM=1 \
            KCFLAGS="${CPU_CFLAGS} -Wno-default-const-init-var-unsafe"

      - name: Prepare kernel files
        working-directory: kernel
        run: |
          KVER="$(make -s LLVM=1 kernelrelease)"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"
          echo "Kernel release: ${KVER}"

          mkdir -p pkgroot/boot
          cp arch/x86/boot/bzImage "pkgroot/boot/vmlinuz-${KVER}"
          cp System.map "pkgroot/boot/System.map-${KVER}"
          cp .config "pkgroot/boot/config-${KVER}"

          make LLVM=1 \
            INSTALL_MOD_PATH="$PWD/pkgroot/usr" \
            INSTALL_MOD_STRIP=1 \
            modules_install

          rm -f \
            "pkgroot/usr/lib/modules/${KVER}/build" \
            "pkgroot/usr/lib/modules/${KVER}/source"

          depmod -b "$PWD/pkgroot/usr" "${KVER}"
          echo "${KVER}" > pkgroot/kernelrelease

          tar --zstd -cf kernel-root.tar.zst -C pkgroot .
          ls -lh kernel-root.tar.zst
          du -sh pkgroot

      - name: Prepare Q704 headers
        working-directory: kernel
        run: |
          KVER="$(make -s LLVM=1 kernelrelease)"
          hdr="$PWD/hdrroot"
          builddir="${hdr}/usr/lib/modules/${KVER}/build"

          install -Dt "${builddir}" -m644 .config Makefile Module.symvers System.map
          install -Dt "${builddir}/kernel" -m644 kernel/Makefile
          install -Dt "${builddir}/arch/x86" -m644 arch/x86/Makefile

          cp -t "${builddir}" -a scripts
          cp -t "${builddir}" -a include
          cp -t "${builddir}/arch/x86" -a arch/x86/include

          if [ -f arch/x86/kernel/asm-offsets.s ]; then
            install -Dt "${builddir}/arch/x86/kernel" -m644 arch/x86/kernel/asm-offsets.s
          fi
          if [ -f tools/objtool/objtool ]; then
            install -Dt "${builddir}/tools/objtool" tools/objtool/objtool
          fi

          find . -path ./hdrroot -prune -o -name 'Kconfig*' -type f -print0 \
            | while IFS= read -r -d '' f; do
                install -Dm644 "$f" "${builddir}/$f"
              done

          for d in "${builddir}"/arch/*/; do
            case "$d" in
              */x86/) ;;
              *) rm -rf "$d" ;;
            esac
          done

          find -L "${builddir}" -type l -delete
          find "${builddir}" -type f -name '*.o' -delete

          mkdir -p "${hdr}/usr/src"
          ln -sr "${builddir}" "${hdr}/usr/src/linux-headers-${KVER}"

          tar --zstd -cf headers-root.tar.zst -C "${hdr}" .
          ls -lh headers-root.tar.zst
          du -sh "${hdr}"

      - name: Upload raw Q704 build
        uses: actions/upload-artifact@v4
        with:
          name: q704-kernel-root
          path: |
            kernel/kernel-root.tar.zst
            kernel/headers-root.tar.zst
          compression-level: 0

  deb:
    name: Package Q704 Ubuntu Debian
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd tar

      - name: Download Q704 build
        uses: actions/download-artifact@v4
        with:
          name: q704-kernel-root
          path: build

      - name: Create Q704 Debian packages
        run: |
          mkdir -p package
          tar --zstd -xf build/kernel-root.tar.zst -C package

          KVER="$(cat package/kernelrelease)"
          rm -f package/kernelrelease
          PKG="linux-cachyos-q704-haswell-eevdf"

          mkdir -p package/DEBIAN
          cat > package/DEBIAN/control <<EOF
          Package: ${PKG}
          Version: ${KVER}
          Section: kernel
          Priority: optional
          Architecture: amd64
          Maintainer: HaloT455 GitHub Actions <noreply@github.com>
          Description: CachyOS 7.2.8 EEVDF kernel optimized for Fujitsu Stylistic Q704 Haswell
           Q704 kernel using Haswell target, PREEMPT_DYNAMIC, HZ 300, MGLRU, O3 and ThinLTO.
          EOF

          cat > package/DEBIAN/postinst <<EOF
          #!/bin/sh
          set -e
          depmod "${KVER}" || true
          if command -v update-initramfs >/dev/null 2>&1; then
              update-initramfs -c -k "${KVER}" || true
          fi
          if command -v update-grub >/dev/null 2>&1; then
              update-grub || true
          fi
          exit 0
          EOF

          cat > package/DEBIAN/prerm <<EOF
          #!/bin/sh
          exit 0
          EOF

          cat > package/DEBIAN/postrm <<EOF
          #!/bin/sh
          set -e
          rm -f "/boot/initrd.img-${KVER}" || true
          depmod -a || true
          if command -v update-grub >/dev/null 2>&1; then
              update-grub || true
          fi
          exit 0
          EOF

          chmod 0755 package/DEBIAN/postinst package/DEBIAN/prerm package/DEBIAN/postrm

          mkdir -p artifacts
          dpkg-deb --build --root-owner-group package \
            "artifacts/${PKG}_${KVER}_amd64.deb"

          mkdir -p package-headers
          tar --zstd -xf build/headers-root.tar.zst -C package-headers
          mkdir -p package-headers/DEBIAN

          cat > package-headers/DEBIAN/control <<EOF
          Package: ${PKG}-headers
          Version: ${KVER}
          Section: kernel
          Priority: optional
          Architecture: amd64
          Depends: ${PKG}
          Maintainer: HaloT455 GitHub Actions <noreply@github.com>
          Description: Headers for the Fujitsu Q704 CachyOS Haswell EEVDF kernel
          EOF

          dpkg-deb --build --root-owner-group package-headers \
            "artifacts/${PKG}-headers_${KVER}_amd64.deb"

          dpkg-deb --info "artifacts/${PKG}_${KVER}_amd64.deb"
          dpkg-deb --info "artifacts/${PKG}-headers_${KVER}_amd64.deb"
          ls -lah artifacts

      - name: Upload Q704 Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: q704-cachyos-haswell-deb
          path: artifacts/*.deb
          retention-days: 30
