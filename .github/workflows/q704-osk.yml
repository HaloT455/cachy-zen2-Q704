name: Build Q704 Zorin Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "q704-osk/**"
      - ".github/workflows/q704-osk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Q704 Zorin Keyboard deb
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             python3 python3-gi python3-evdev python3-pyatspi             gir1.2-gtk-3.0 x11-utils dpkg-dev

      - name: Validate Python and AT-SPI
        run: |
          python3 -m py_compile q704-osk/q704_osk.py
          python3 -c 'import pyatspi; print("AT-SPI OK")'
          python3 -c 'import gi; gi.require_version("AyatanaAppIndicator3","0.1"); from gi.repository import AyatanaAppIndicator3; print("AppIndicator OK")'

      - name: Build Debian package
        run: |
          set -e
          VER="1.2.0"
          PKGROOT="$PWD/pkgroot"

          rm -rf "$PKGROOT" artifacts
          mkdir -p "$PKGROOT/DEBIAN"
          mkdir -p "$PKGROOT/usr/bin"
          mkdir -p "$PKGROOT/usr/lib/q704-zorin-keyboard"
          mkdir -p "$PKGROOT/usr/share/applications"
          mkdir -p "$PKGROOT/etc/xdg/autostart"
          mkdir -p "$PKGROOT/etc/udev/rules.d"
          mkdir -p "$PKGROOT/etc/modules-load.d"

          install -m 0755 q704-osk/q704_osk.py             "$PKGROOT/usr/lib/q704-zorin-keyboard/q704_osk.py"

          install -m 0755 q704-osk/q704-zorin-keyboard             "$PKGROOT/usr/bin/q704-zorin-keyboard"

          install -m 0644 q704-osk/q704-zorin-keyboard.desktop             "$PKGROOT/usr/share/applications/q704-zorin-keyboard.desktop"

          install -m 0644 q704-osk/q704-zorin-keyboard-autostart.desktop             "$PKGROOT/etc/xdg/autostart/q704-zorin-keyboard.desktop"

          install -m 0644 q704-osk/80-q704-uinput.rules             "$PKGROOT/etc/udev/rules.d/80-q704-uinput.rules"

          printf '%s\n' uinput > "$PKGROOT/etc/modules-load.d/q704-zorin-keyboard.conf"

          {
            echo "Package: q704-zorin-keyboard"
            echo "Version: $VER"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: all"
            echo "Depends: python3, python3-gi, python3-evdev, python3-pyatspi, gir1.2-gtk-3.0, gir1.2-ayatanaappindicator3-0.1, x11-utils"
            echo "Recommends: xwayland"
            echo "Maintainer: HaloT455 <noreply@github.com>"
            echo "Description: Zorin-themed touch keyboard for Fujitsu Stylistic Q704"
            echo " Auto-opens on editable fields through AT-SPI, emits real keyboard"
            echo " events through uinput, and docks to the bottom of the screen."
          } > "$PKGROOT/DEBIAN/control"

          install -m 0755 q704-osk/postinst "$PKGROOT/DEBIAN/postinst"

          printf '%s\n' '#!/bin/sh' 'exit 0' > "$PKGROOT/DEBIAN/prerm"
          chmod 0755 "$PKGROOT/DEBIAN/prerm"

          mkdir -p artifacts
          dpkg-deb --build --root-owner-group             "$PKGROOT"             "artifacts/q704-zorin-keyboard_${VER}_all.deb"

          dpkg-deb --info "artifacts/q704-zorin-keyboard_${VER}_all.deb"
          dpkg-deb --contents "artifacts/q704-zorin-keyboard_${VER}_all.deb"
          sha256sum artifacts/*.deb > artifacts/SHA256SUMS
          ls -lah artifacts

      - name: Upload Q704 keyboard
        uses: actions/upload-artifact@v4
        with:
          name: q704-zorin-keyboard-v1.2-deb
          path: artifacts/*
          retention-days: 30
