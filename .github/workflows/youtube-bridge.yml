name: Build YouTube Bridge APK

on:
  push:
    branches:
      - youtube-bridge
    paths:
      - 'youtube-bridge/**'
      - '.github/workflows/youtube-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: youtube-bridge
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Bridge-APK
          path: youtube-bridge/app/build/outputs/apk/debug/app-debug.apk
