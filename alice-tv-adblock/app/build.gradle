plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halo.alicetvadblock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.halo.alicetvadblock'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
}

dependencies {
    // Bundled, on-device OCR; no remote image upload.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
